name: Build e Validação FastLocation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Validar código e gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Configurar Flutter 3.7.12
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.7.12'
          channel: 'stable'
          cache: true

      - name: Garantir arquivos base do Android (Gradle Wrapper e ícones)
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --org br.com.fastdelivery --platforms=android .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          rm -rf test

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze --no-fatal-infos

      - name: Gerar APK (debug)
        run: flutter build apk --debug

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: fast-location-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
